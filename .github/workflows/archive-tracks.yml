name: Archive and publish Dikiye Sochi

on:
  schedule:
    - cron: '22 5 * * *' # 08:22 Moscow
    - cron: '*/5 * * * *' # Temporary schedule verification; remove after a real scheduled run
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dikiye-sochi-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q sync.py build_site.py tests

  archive:
    needs: checks
    # This workflow cannot deploy from the personal <owner>.github.io repository.
    if: >-
      github.event_name != 'pull_request' &&
      github.event.repository.name == 'dikiye-sochi-archive' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      site_ready: ${{ steps.pages_artifact.outcome == 'success' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Download and verify files
        id: sync
        continue-on-error: true
        run: python -u sync.py
      - name: Build catalog including last-run status
        id: build
        continue-on-error: true
        run: python build_site.py
      - name: Preserve downloaded archive even after a partial sync failure
        id: save
        if: ${{ !cancelled() && steps.sync.outcome != 'skipped' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/
          if ! git diff --cached --quiet; then
            git commit -m "Archive routes ($(date -u +%F))"
            git push origin HEAD:main
          fi
      - name: Keep recoverable copy if repository push fails
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload project site
        id: pages_artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.save.outcome == 'success' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/
      - name: Mark incomplete checks as failed
        if: ${{ !cancelled() && (steps.sync.outcome != 'success' || steps.build.outcome != 'success') }}
        run: |
          echo 'Sync or site build failed; inspect data/manifest.json in the archive-data artifact.'
          exit 1

  deploy:
    needs: archive
    if: ${{ !cancelled() && needs.archive.outputs.site_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy separate project site
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
